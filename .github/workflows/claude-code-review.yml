# Claude Code Review: runs the code-review plugin on every pull request and posts its findings as comments.
# The appended system prompt gives the review constitution Development 4 (.specify/memory/constitution.md):
# every claim it posts cites a file and line or a command, or says "unverified" (issue #218, spec 034).
# See .docs/development.md § CI.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # --comment posts the review with GITHUB_TOKEN
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Copilot's PRs run as the actor "Copilot", which has no write access, so Anthropic's
          # OIDC app-token exchange answers 401. Passing github_token skips that exchange;
          # allowed_bots lets the action's own actor check accept Copilot.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: 'Copilot'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Development 4's home is the constitution; this prompt only says how a posted review meets it.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "Constitution Development 4 (.specify/memory/constitution.md) applies to this review: every claim rests on the code, and nothing is assumed or made up. Before you post, give every claim in every comment the file and line it rests on (a link or path:line) or the command that shows it. A claim you could not check against the code says unverified, in that word. Every subagent you launch gets this rule in its prompt."
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

