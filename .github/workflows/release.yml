name: Release

# Builds dmc with Native AOT on each platform's own runner, packs each build as a four-file archive (dmc and its three
# native libraries), checks that get-dmc installs and runs it, publishes the archives as a GitHub Release, and opens
# the pull request that pins that release in tools/dmc-release.json (issue #3, "Build and release").
#
# Only pushing a tag dmc-vX.Y.Z publishes anything. A pull request that changes the release files, or a manual run,
# is a dry run: it builds, packs, hashes and installs everything the same way, writes the pin file it would propose,
# and uploads it all as workflow artifacts. A dry run creates no release, pushes nothing and opens no pull request.
#
# Triggers: a pushed tag dmc-v*, which releases; a pull request that touches this file, .github/release/, tools/,
# src/Dmc.Cli/Dmc.Cli.csproj, or one of the build settings every release build uses (Directory.Build.props,
# Directory.Packages.props, global.json), and a manual run (workflow_dispatch), both dry runs.
#
# An archive holds exactly dmc and its native libraries: the pack step copies only the program and the *.dll and *.so
# files of the publish folder, so neither symbols nor the XML documentation file could get into it, and it fails
# the build unless there are exactly four files. There is no macOS build: dmc is released for Windows and Linux only.

on:
  push:
    tags: ["dmc-v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/release/**
      - tools/**
      - src/Dmc.Cli/Dmc.Cli.csproj
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # Works out the tag and version: from the pushed tag (which must be dmc-vX.Y.Z and on main), or, in a dry run, 0.0.0.
  prepare:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="$GITHUB_REF_NAME"
            if ! printf '%s\n' "$tag" | grep -Eq '^dmc-v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::A release tag is dmc-vX.Y.Z, not $tag."
              exit 1
            fi
            # The pin pull request goes to main, so the release must be built from main.
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$tag is not on main. Tag a commit of main."
              exit 1
            fi
            publish=true
          else
            # A dry run builds a release-shaped version that no real release has: the project file's own version is
            # the development one (0.0.0-dev), which is not a release tag.
            version="0.0.0"
            tag="dmc-v$version"
            publish=false
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#dmc-v}"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "$tag (publish: $publish)"

  # On each platform's own runner: publishes dmc with Native AOT, packs the four-file archive and its SHA-256, installs it
  # with get-dmc.sh and get-dmc.ps1, runs it, checks that a corrupted archive is refused, and uploads the archive as an artifact.
  build:
    name: ${{ matrix.rid }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-11-arm
          # Linux on 22.04: an AOT binary runs only on the same or a newer glibc than it was built with.
          - rid: linux-x64
            os: ubuntu-22.04
          - rid: linux-arm64
            os: ubuntu-22.04-arm
    defaults:
      run:
        shell: bash
    env:
      RID: ${{ matrix.rid }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Install the Native AOT toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang zlib1g-dev
      - name: Publish dmc with Native AOT
        run: dotnet publish src/Dmc.Cli -c Release -r "$RID" -o publish -p:PublishAot=true -p:Version="$VERSION"
      - name: Pack dmc and its three native libraries
        run: |
          set -euo pipefail
          exe=dmc
          case "$RID" in win-*) exe=dmc.exe ;; esac
          mkdir -p pack dist
          cp "publish/$exe" pack/
          # The native libraries only: not the symbol files (.pdb, .dbg).
          find publish -maxdepth 1 -type f \( -name '*.dll' -o -name '*.so' \) -exec cp {} pack/ \;
          ls -l pack
          count="$(ls pack | wc -l | tr -d ' ')"
          if [ "$count" -ne 4 ]; then
            echo "::error::A release is dmc and three native libraries; this build has $count files."
            exit 1
          fi
          case "$RID" in
            win-*)
              asset="$TAG-$RID.zip"
              pwsh -NoProfile -Command "Compress-Archive -Path pack/* -DestinationPath dist/$asset"
              ;;
            *)
              asset="$TAG-$RID.tar.gz"
              tar --owner=0 --group=0 -czf "dist/$asset" -C pack $(ls pack)
              ;;
          esac
          hash="$(sha256sum < "dist/$asset")"
          printf '%s  %s\n' "${hash%% *}" "$asset" > "dist/$asset.sha256"
          cat "dist/$asset.sha256"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - name: Install the archive with get-dmc and run it
        run: |
          set -euo pipefail
          # get-dmc takes the archive from dist/ instead of the release (DMC_GET_TEST_ASSETS), with a pin of this
          # one archive written by the same script as the pin pull request.
          bash .github/release/write-pin.sh "$TAG" dist
          cat tools/dmc-release.json
          assets="$PWD/dist"
          if [ "$RUNNER_OS" = Windows ]; then assets="$(cygpath -w "$assets")"; fi
          export DMC_GET_TEST_ASSETS="$assets"
          expected="get-dmc: installed dmc $VERSION ($RID) in bin/"

          check_install() { # $1: what ran; $2: its output
            if [ "$2" != "$expected" ]; then echo "::error::$1 printed '$2', not '$expected'"; exit 1; fi
          }
          check_silent() {
            if [ -n "$2" ]; then echo "::error::$1 printed '$2' with dmc already current"; exit 1; fi
          }

          rm -rf bin
          # On Windows, get-dmc.sh hands over to get-dmc.ps1 in Windows PowerShell 5.1.
          check_install "get-dmc.sh" "$(bash tools/get-dmc.sh)"
          check_silent "get-dmc.sh" "$(bash tools/get-dmc.sh 2>&1)"
          rm -rf bin
          check_install "get-dmc.ps1 (pwsh)" "$(pwsh -NoProfile -File tools/get-dmc.ps1)"
          check_silent "get-dmc.ps1 (pwsh)" "$(pwsh -NoProfile -File tools/get-dmc.ps1 2>&1)"
          ls -l bin

          ./bin/dmc --version
          [ "$(./bin/dmc --version)" = "dmc $VERSION" ]
          ./bin/dmc roll 1d20+5 4d6kh3
          # The map picture loads SkiaSharp and HarfBuzzSharp, and a page image loads PDFium, from bin/.
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          printf '%s' '{"title": "Smoke", "grid": ["#####", "#...#", "#####"], "tokens": [{"id": "@", "name": "Hero", "kind": "pc", "at": "B2"}]}' > "$smoke/live.json"
          ./bin/dmc map "$smoke/live.json" --png
          test -s "$smoke/live.png"
          ./bin/dmc pdf render tests/Dmc.Tests/Pdf/Fixtures/owner-only.pdf --pages 1 --out "$smoke/pdf"
          test -s "$smoke/pdf/pages/page-001.jpg"

          # An archive that does not match the pin is refused, and bin/ is left as it was.
          mkdir -p "$smoke/bad"
          cp "dist/$ASSET" "$smoke/bad/$ASSET"
          printf 'x' >> "$smoke/bad/$ASSET"
          rm -rf bin
          bad="$smoke/bad"
          if [ "$RUNNER_OS" = Windows ]; then bad="$(cygpath -w "$bad")"; fi
          if out="$(DMC_GET_TEST_ASSETS="$bad" bash tools/get-dmc.sh 2>&1)"; then
            echo "::error::get-dmc installed an archive that does not match its SHA-256"; exit 1
          fi
          echo "$out"
          case "$out" in *"does not match its SHA-256"*) ;; *) echo "::error::unexpected refusal: $out"; exit 1 ;; esac
          if [ -e bin/dmc ] || [ -e bin/dmc.exe ]; then echo "::error::a refused archive left dmc in bin/"; exit 1; fi

          git checkout -- tools/dmc-release.json
          rm -rf bin
      - uses: actions/upload-artifact@v7
        with:
          name: dmc-${{ matrix.rid }}
          path: dist/
          if-no-files-found: error
          overwrite: true

  # Tag pushes only: creates the GitHub Release from the archives (keeping one that is already published), then hashes
  # what the release really holds, for the pin.
  release:
    name: GitHub Release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dmc-*
          path: dist
          merge-multiple: true
      - name: Publish the release
        run: |
          set -euo pipefail
          # A re-run (after a failed pin job, say) keeps a release that is already published: its archives are what
          # players download, so the pin is written from them below, and this run's builds are not uploaded.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::$TAG is already published. Its archives are kept, and the pin is written from them."
            exit 0
          fi
          cat dist/*.sha256 > dist/SHA256SUMS.txt
          {
            echo "dmc $VERSION, the toolkit's helper program, built with Native AOT for Windows and Linux. macOS is no longer built."
            echo
            echo "Players do not download these by hand: \`./play.ps1\`, \`./play.sh\` and \`tools/get-dmc\` fetch the right one into \`bin/\` and check its SHA-256 against \`tools/dmc-release.json\` first."
            echo
            echo "SHA-256:"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release create "$TAG" dist/*.zip dist/*.tar.gz dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "dmc $VERSION" --notes-file notes.md
      - name: Hash the archives on the release
        run: |
          set -euo pipefail
          # The pin is written from what the release really holds: downloaded back and hashed here.
          mkdir -p published hashes
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published --pattern "$TAG-*"
          for rid in win-x64 win-arm64 linux-x64 linux-arm64; do
            found="$(find published -maxdepth 1 \( -name "$TAG-$rid.zip" -o -name "$TAG-$rid.tar.gz" \) | wc -l | tr -d ' ')"
            if [ "$found" -ne 1 ]; then
              echo "::error::$TAG on GitHub has $found archives for $rid, not 1. Delete the release (gh release delete $TAG --yes, keeping the tag) and re-run this workflow."
              exit 1
            fi
          done
          for file in published/*; do
            asset="$(basename "$file")"
            hash="$(sha256sum < "$file")"
            printf '%s  %s\n' "${hash%% *}" "$asset" > "hashes/$asset.sha256"
          done
          cat hashes/*.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: release-hashes
          path: hashes/
          if-no-files-found: error
          overwrite: true

  # Writes tools/dmc-release.json with write-pin.sh and checks it. On a release it also pushes the branch pin-<tag> and opens
  # the pull request that pins it; on a dry run it only uploads the pin file it would propose.
  pin:
    name: Pin pull request
    needs: [prepare, build, release]
    # After the release on a tag; straight after the builds on a dry run, where the release job is skipped.
    if: always() && needs.build.result == 'success' && (needs.release.result == 'success' || (needs.release.result == 'skipped' && needs.prepare.outputs.publish != 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PUBLISH: ${{ needs.prepare.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          # On a release the pin goes onto main. No credentials are left in .git/config, where write-pin.sh (from a
          # pull request, on a dry run) could read them: the push below names its token itself.
          ref: ${{ needs.prepare.outputs.publish == 'true' && 'main' || '' }}
          persist-credentials: false
      # On a release, the hashes of the archives on the release (which a re-run keeps); on a dry run, of this run's.
      - uses: actions/download-artifact@v8
        if: env.PUBLISH == 'true'
        with:
          name: release-hashes
          path: ${{ runner.temp }}/dist
      - uses: actions/download-artifact@v8
        if: env.PUBLISH != 'true'
        with:
          pattern: dmc-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: Write the pin
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/dist"
          ls -l "$dist"
          for rid in win-x64 win-arm64 linux-x64 linux-arm64; do
            if ! ls "$dist/$TAG-$rid".*.sha256 > /dev/null 2>&1; then echo "::error::No archive for $rid."; exit 1; fi
          done
          bash .github/release/write-pin.sh "$TAG" "$dist"
          jq -e --arg tag "$TAG" '.tag == $tag and (.sha256 | length) == 4' tools/dmc-release.json > /dev/null
          git diff
          mkdir -p "$RUNNER_TEMP/pin"
          cp tools/dmc-release.json "$RUNNER_TEMP/pin/"
      - uses: actions/upload-artifact@v7
        with:
          name: pin
          path: ${{ runner.temp }}/pin/
          overwrite: true
      # Safe to re-run: it force-pushes its own branch pin-<tag>, and leaves an open pull request open. DMC_PIN_PR_TOKEN
      # (optional, a token that may push and open pull requests) makes the pull request run the tests; one opened with
      # the workflow's own token does not.
      - name: Open the pull request
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.DMC_PIN_PR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "::notice::main already pins $TAG. Nothing to do."
            exit 0
          fi
          branch="pin-$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add tools/dmc-release.json
          git commit -m "Pin dmc $VERSION" -m "Written by the release workflow for $TAG: the tag and the SHA-256 of each archive in tools/dmc-release.json."
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          open="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state open --json url --jq '.[0].url // ""')"
          if [ -n "$open" ]; then
            echo "::notice::The pin pull request is already open: $open. Its branch now holds this run's commit."
            exit 0
          fi
          {
            echo "Pins the release [$TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG) in \`tools/dmc-release.json\`, written by the release workflow ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))."
            echo
            echo "- \`tools/dmc-release.json\`: the tag and the SHA-256 of each archive on the release. Once this is merged, \`./play.ps1\` and \`./play.sh\` fetch dmc into \`bin/\` with \`tools/get-dmc\` and start play through \`bin/dmc play\`."
            echo
            echo "Each archive was installed with get-dmc and run on its own platform's runner before the release was published."
            echo
            echo "If no checks ran on this pull request (a pull request opened with the workflow's own token does not start other workflows), close and reopen it to run the tests before merging."
          } > body.md
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "Pin dmc $VERSION" --body-file body.md
