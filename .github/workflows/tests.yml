name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The Python scripts stay until Phase 6 of issue #3, so their own tests keep running.
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyMuPDF
        run: python -m pip install -r scripts/requirements.txt
      - name: Run the tests
        run: python -m unittest discover -s tests -v

  # dmc, the .NET replacement for the scripts. It is published for the runner with Native AOT, the way a release
  # is built, and the tests then run it as a subprocess. The parity check also runs the old scripts, so Python is
  # needed here too (and bash and PowerShell, which every runner image has).
  dotnet:
    name: dotnet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the Native AOT toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang zlib1g-dev
      - name: Publish dmc with Native AOT
        run: dotnet publish src/Dmc.Cli -c Release -r ${{ matrix.rid }} -o bin -p:PublishAot=true
      - name: Run the tests
        run: dotnet test -c Release
