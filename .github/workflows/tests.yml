name: Tests

# Builds and tests the toolkit's .NET code. It runs on every pull request, and on every push to main, unless the change
# touches only files that are not code: Markdown and text files are skipped, except the ones the toolkit tests read as
# DMC's instructions (CLAUDE.md, README.md, .claude/skills/ and templates/), which still run it. For each of
# Linux, Windows and macOS (Apple Silicon) it publishes dmc with Native AOT twice (a development build, and one with a
# release's version number), builds the tests, installs Playwright's Chromium and runs all the tests. It writes
# nothing to the repository and publishes nothing. The build treats a missing XML comment on a public member of dmc as
# an error (CS1591; see Directory.Build.props), so the first publish step fails on one.

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!**.txt"
      # The prompts: ToolkitTests checks their commands, skills and paths, so a change to them is tested.
      - CLAUDE.md
      - README.md
      - .claude/skills/**
      - templates/**
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!**.txt"
      # The prompts: ToolkitTests checks their commands, skills and paths, so a change to them is tested.
      - CLAUDE.md
      - README.md
      - .claude/skills/**
      - templates/**

jobs:
  # The only job: publish dmc for the runner's platform, then build and run the tests against it.
  # dmc is published for the runner with Native AOT, the way a release is built, and the tests then run it as a
  # subprocess. bash and PowerShell, which the launcher and get-dmc tests use, are on every runner image.
  dotnet:
    name: dotnet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Install the Native AOT toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang zlib1g-dev
      # Not into bin/, which is the player's install. The black-box tests run this one, and insist that it says 0.0.0-dev.
      - name: Publish dmc with Native AOT
        run: dotnet publish src/Dmc.Cli -c Release -r ${{ matrix.rid }} -o artifacts/bin -p:PublishAot=true
      # The get-dmc and launcher tests install a release, which says its version and not 0.0.0-dev: the same build, made
      # as the release workflow makes it, with a version of its own. The tests find it through DMC_TEST_RELEASE_DIR.
      - name: Publish a release-versioned dmc with Native AOT
        run: dotnet publish src/Dmc.Cli -c Release -r ${{ matrix.rid }} -o artifacts/release -p:PublishAot=true -p:Version=9.9.9
      - name: Build the tests
        run: dotnet build tests/Dmc.Tests -c Release
      # The map page tests drive Chromium. The runner images have PowerShell (pwsh), which Playwright's installer needs.
      - name: Install Playwright's Chromium
        shell: pwsh
        run: |
          $extra = @(); if ($IsLinux) { $extra = @("--with-deps") }
          pwsh tests/Dmc.Tests/bin/Release/net10.0/playwright.ps1 install @extra chromium
      - name: Run the tests
        env:
          DMC_TEST_RELEASE_DIR: ${{ github.workspace }}/artifacts/release
        run: dotnet test -c Release --no-build
